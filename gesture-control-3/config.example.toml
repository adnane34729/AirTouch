# Two-hand gestures. Both hands are required, which is what makes them
# safe to bind to mode changes and to quitting: they cannot be triggered
# while gesturing with one hand. Use shape = for a symmetric gesture
# (the same hand shape on both hands) or left =/right = for an ordered one.

[[two_hand]]
name = "mode_next"
action = "mode_next"
label = "BOTH OPEN"
shape = "thumb:up,index:up,middle:up,ring:up,pinky:up"
description = "Both palms open: next mode."
repeatable = false

[[two_hand]]
name = "mode_prev"
action = "mode_prev"
label = "BOTH FISTS"
shape = "thumb:down,index:down,middle:down,ring:down,pinky:down"
description = "Both hands closed: previous mode."
repeatable = false

[[two_hand]]
name = "mode_home"
action = "mode_home"
label = "BOTH PEACE"
shape = "thumb:down,index:up,middle:up,ring:down,pinky:down"
description = "Both V signs: jump back to the first mode."
repeatable = false

[[two_hand]]
name = "pause"
action = "pause_toggle"
label = "BOTH SHAKA"
shape = "thumb:up,index:down,middle:down,ring:down,pinky:up"
description = "Both hands thumb+little: pause or resume."
repeatable = false

[[two_hand]]
name = "quit"
action = "quit_app"
label = "BOTH HORNS"
shape = "thumb:down,index:up,middle:down,ring:down,pinky:up"
description = "Both hands index+little: quit the controller."
repeatable = false
