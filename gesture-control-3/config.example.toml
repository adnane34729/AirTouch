# gesture-control configuration reference
#
# Copy this file, edit it, then run:
#     python -m gesture_control --config my-config.toml
#
# Every value below is a default; delete any line you do not want to change.
# An unknown key is a hard error naming the valid ones, so typos surface at
# startup instead of being silently ignored.
#
# Precedence: built-in defaults < preset < this file < command-line flags.
#
# MODES
# -----
# Each [[modes]] entry owns its own [[modes.gestures]] table, so the same hand
# shape can do different things in different modes -- 'index' is volume in the
# media mode and brightness in the system mode. Switch modes with a two-hand
# gesture (see [[two_hand]] at the bottom), never with one hand.
#
# TWO-HAND GESTURES
# -----------------
# Both hands are required and must be held: the application gives them a longer
# arming time than single-hand gestures precisely so that changing mode or
# quitting cannot happen by accident.
#
#   shape = ...    symmetric: the same shape on both hands (handedness-agnostic)
#   left = ...     ordered: a different shape per hand
#   right = ...
#
# Finger states are 'up', 'down' or 'any'. 'any' means the gesture ignores that
# finger. Within one mode, two gestures that could both match the same hand are
# rejected at startup, so a mode can never be ambiguous.

# Hand Gesture Control configuration
# Generated by: python -m gesture_control --print-config
#
# Precedence: these values override the selected preset; command-line
# flags override this file. Unknown keys are an error, not a warning.
#
# Modes: each [mode] owns its own gesture table, so the same hand shape
# can do different things in different modes. Switch modes with a
# two-hand gesture (see [[two_hand]] at the bottom).

preset = "pro"
log_level = "INFO"

[camera]
index = 0
width = 1280
height = 720
fps = 30
mirror = true
fourcc = ""
reopen_attempts = 5
reopen_delay = 1.0

[detector]
max_hands = 2
model_complexity = 1
min_detection_confidence = 0.5
min_tracking_confidence = 0.5
static_image_mode = false
stride = 1
downscale_width = 0

[smoothing]
enabled = true
min_cutoff = 1.1
beta = 0.035
d_cutoff = 1.0

[tracking]
arm_seconds = 0.1
release_seconds = 0.12
repeat_initial_delay = 0.45
repeat_interval = 0.12
default_cooldown = 0.25
two_hand_arm_seconds = 0.55
two_hand_release_seconds = 0.3

[thresholds]
finger_curl_up = 150.0
finger_curl_down = 120.0
finger_reach_up = 1.15
finger_reach_down = 0.95
thumb_curl_up = 150.0
thumb_curl_down = 130.0
thumb_abduction_up = 0.35
thumb_abduction_down = 0.28

[actions]
volume_step = 0.05
brightness_step = 8
# brightness_display = <unset>
dry_run = false
require_focus_title = ""
allow_keyboard = true

[overlay]
show_window = true
show_skeleton = true
show_finger_states = true
show_guide = true
show_system_levels = true
show_timings = true
scale = 1.0
window_title = "Hand Gesture Control"

[switching]
start = "media"
wrap = true
announce_seconds = 1.8
settle_seconds = 0.5
allow_while_paused = true
primary_hand = "right"
single_hand_with_two_visible = "primary"

# requirements: 'up', 'down' or 'any' per finger; 'any' means the
# gesture does not care about that finger. Gestures within a mode are
# validated for ambiguity at startup.

[[modes]]
name = "media"
label = "MEDIA"
accent = "accent"
description = "Playback: transport, tracks and volume."

[[modes.gestures]]
name = "play_pause"
action = "key_play_pause"
label = "OPEN PALM"
requirements = "thumb:up,index:up,middle:up,ring:up,pinky:up"
description = "all five out"

[[modes.gestures]]
name = "mute"
action = "mute_toggle"
label = "FIST"
requirements = "thumb:down,index:down,middle:down,ring:down,pinky:down"
description = "closed hand"

[[modes.gestures]]
name = "volume_up"
action = "volume_up"
label = "INDEX"
requirements = "thumb:down,index:up,middle:down,ring:down,pinky:down"
description = "one finger"
repeatable = true

[[modes.gestures]]
name = "volume_down"
action = "volume_down"
label = "PEACE"
requirements = "thumb:down,index:up,middle:up,ring:down,pinky:down"
description = "V sign"
repeatable = true

[[modes.gestures]]
name = "next"
action = "next_track"
label = "PINKY"
requirements = "thumb:down,index:down,middle:down,ring:down,pinky:up"
description = "little finger"
repeatable = false

[[modes.gestures]]
name = "prev"
action = "previous_track"
label = "RING+PINKY"
requirements = "thumb:down,index:down,middle:down,ring:up,pinky:up"
description = "two, outer"
repeatable = false

[[modes.gestures]]
name = "stop"
action = "stop_media"
label = "THUMB UP"
requirements = "thumb:up,index:down,middle:down,ring:down,pinky:down"
description = "thumbs up"
repeatable = false

[[modes.gestures]]
name = "media_vol_up"
